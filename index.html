<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma EAD para cursos livres do Polo UniFil Iguaraçu.">
  <title>UniFil Cursos Livres | Ambiente Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="loginScreen" class="login-screen">
      <div class="login-brand">
        <div class="brand-mark">U</div>
        <div>
          <strong>UniFil</strong>
          <span>Cursos Livres</span>
        </div>
      </div>

      <div class="login-card">
        <div class="eyebrow">AMBIENTE VIRTUAL DE APRENDIZAGEM</div>
        <h1>Aprenda no seu ritmo.</h1>
        <p>Entre na plataforma para acessar seus cursos, aulas e materiais.</p>

        <form id="loginForm">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" required>

          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="Digite sua senha" required>
            <button type="button" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
          </div>

          <button class="primary-btn" type="submit">Entrar na plataforma</button>
        </form>

        <div class="demo-box">
          <strong>Modo demonstração</strong>
          <span>Use qualquer e-mail e senha. Escolha o perfil no menu depois de entrar.</span>
        </div>
      </div>
    </section>

    <section id="platform" class="platform hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">U</div>
          <div><strong>UniFil</strong><small>Cursos Livres</small></div>
        </div>
        <nav id="mainNav"></nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="logout-btn">Sair da conta</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <div class="breadcrumb">Ambiente Virtual</div>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
          <div class="top-actions">
            <select id="roleSelector" title="Perfil de demonstração">
              <option value="student">Aluno</option>
              <option value="teacher">Professor</option>
              <option value="manager">Gestor</option>
            </select>
            <button class="icon-btn" id="notificationBtn" aria-label="Notificações">🔔</button>
            <div class="avatar" id="userAvatar">AL</div>
          </div>
        </header>

        <div id="pageContent" class="page-content"></div>
      </main>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
